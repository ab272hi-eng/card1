<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة عضوية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        .card-preview {
            background: linear-gradient(135deg, #003d82 0%, #1a5f9d 100%);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: white;
            margin-bottom: 30px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .photo-area {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .photo-area img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .photo-placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            text-align: center;
        }
        
        .name-field {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        
        .job-field {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #003d82;
            box-shadow: 0 0 0 3px rgba(0, 61, 130, 0.1);
        }
        
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }
        
        .file-input-label {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #003d82;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .file-input-label:hover {
            background: #1a5f9d;
        }
        
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        
        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-save {
            background: #003d82;
            color: white;
        }
        
        .btn-save:hover {
            background: #1a5f9d;
            box-shadow: 0 5px 15px rgba(0, 61, 130, 0.3);
        }
        
        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <h2 style="text-align: center; margin-bottom: 30px; color: #003d82;">بطاقة عضوية</h2>
        
        <!-- معاينة البطاقة -->
        <div class="card-preview">
            <div class="photo-area">
                <img id="previewImage" style="display: none;" alt="الصورة">
                <div id="photoPlaceholder" class="photo-placeholder">📷<br>الصورة</div>
            </div>
            <div class="name-field" id="previewName">أدخل الاسم</div>
            <div class="job-field" id="previewJob">أدخل الوظيفة</div>
        </div>
        
        <!-- نموذج الإدخال -->
        <form id="cardForm">
            <div class="form-group">
                <label for="nameInput">الاسم *</label>
                <input 
                    type="text" 
                    id="nameInput" 
                    placeholder="أدخل الاسم الكامل"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="jobInput">الوظيفة *</label>
                <input 
                    type="text" 
                    id="jobInput" 
                    placeholder="أدخل الوظيفة"
                    required
                >
            </div>
            
            <div class="form-group">
                <label>صورة الملف الشخصي *</label>
                <div class="file-input-wrapper">
                    <label for="photoInput" class="file-input-label">
                        📤 تحميل الصورة من الاستديو
                    </label>
                    <input 
                        type="file" 
                        id="photoInput" 
                        accept="image/*"
                        required
                    >
                </div>
                <div class="file-name" id="fileName"></div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">💾 حفظ البطاقة</button>
                <button type="reset" class="btn-reset">🔄 إعادة تعيين</button>
            </div>
        </form>
    </div>
    
    <script>
        // تحديث اسم الشخص
        document.getElementById('nameInput').addEventListener('input', function(e) {
            document.getElementById('previewName').textContent = e.target.value || 'أدخل الاسم';
        });
        
        // تحديث الوظيفة
        document.getElementById('jobInput').addEventListener('input', function(e) {
            document.getElementById('previewJob').textContent = e.target.value || 'أدخل الوظيفة';
        });
        
        // تحميل الصورة
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('previewImage');
                    img.src = event.target.result;
                    img.style.display = 'block';
                    document.getElementById('photoPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
                
                // عرض اسم الملف
                document.getElementById('fileName').textContent = `✓ تم تحميل: ${file.name}`;
            }
        });
        
        // معالجة إرسال النموذج
        document.getElementById('cardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم حفظ البطاقة بنجاح! ✓');
        });
        
        // إعادة تعيين النموذج
        document.getElementById('cardForm').addEventListener('reset', function() {
            setTimeout(() => {
                document.getElementById('previewName').textContent = 'أدخل الاسم';
                document.getElementById('previewJob').textContent = 'أدخل الوظيفة';
                document.getElementById('previewImage').style.display = 'none';
                document.getElementById('photoPlaceholder').style.display = 'block';
                document.getElementById('fileName').textContent = '';
            }, 0);
        });
    </script>
</body>
</html>
